<section class="scanner">
  <div class="wrap">
    <div class="crumbs"><a href="{{ prefix }}/">rice.ag</a> / {{ T.nav_scanner }}</div>
    <h1>{{ T.sc_title }} <span class="pill beta" style="vertical-align:middle;font-size:.9rem">v1</span></h1>
    <p class="lead" style="max-width:760px;color:var(--muted);font-size:1.08rem">{{ T.sc_intro }}</p>

    <div class="sc-grid">
      <aside class="panel controls" aria-label="{{ T.sc_step1 }}">
        <h2>{{ T.sc_step1 }}</h2>
        <div class="drop" id="drop">
          <p><strong>{{ T.sc_drop }}</strong></p>
          <p class="fine">{{ T.sc_or }}</p>
          <div class="btn-col">
            <label class="btn btn-primary" for="fCam">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 7h3l2-3h8l2 3h3v13H3z"/><circle cx="12" cy="13" r="4"/></svg>
              {{ T.sc_take }}</label>
            <input type="file" id="fCam" accept="image/*" capture="environment" class="hidden">
            <label class="btn btn-ghost" for="fFile">{{ T.sc_upload }}</label>
            <input type="file" id="fFile" accept="image/*" class="hidden">
            <button type="button" class="btn btn-ghost" id="bSample">{{ T.sc_sample }}</button>
          </div>
        </div>
        <p class="fine" style="margin-top:10px"><a href="{{ prefix }}/guide/">{{ T.nav_guide }} →</a></p>

        <h2 style="margin-top:18px">{{ T.sc_step2 }}</h2>
        <div class="field">
          <label for="oLight">{{ T.sc_lighting }}</label>
          <select id="oLight">
            <option value="auto">{{ T.sc_light_auto }}</option>
            <option value="dark">{{ T.sc_light_dark }}</option>
            <option value="backlit">{{ T.sc_light_backlit }}</option>
          </select>
        </div>
        <div class="field">
          <label for="oCoin">{{ T.sc_coin }}</label>
          <select id="oCoin">
            <option value="">{{ T.sc_coin_none }}</option>
            <option value="26" {% if lang == 'th' %}selected{% endif %}>{{ 'เหรียญ 10 บาท' if lang == 'th' else 'Thai 10 baht' }} (26 mm)</option>
            <option value="24">{{ 'เหรียญ 5 บาท' if lang == 'th' else 'Thai 5 baht' }} (24 mm)</option>
            <option value="21.75">{{ 'เหรียญ 2 บาท' if lang == 'th' else 'Thai 2 baht' }} (21.75 mm)</option>
            <option value="20">{{ 'เหรียญ 1 บาท' if lang == 'th' else 'Thai 1 baht' }} (20 mm)</option>
            <option value="27">{{ 'เหรียญ 10 รูปี (อินเดีย)' if lang == 'th' else 'India ₹10' }} (27 mm)</option>
            <option value="24.26">{{ 'เหรียญ 25 เซนต์ (สหรัฐฯ)' if lang == 'th' else 'US quarter' }} (24.26 mm)</option>
            <option value="custom">{{ T.sc_coin_custom }}</option>
          </select>
          <input type="number" id="oCoinMM" class="hidden" min="5" max="60" step="0.01" placeholder="{{ T.sc_coin_mm }}" aria-label="{{ T.sc_coin_mm }}">
          <span class="hint">{{ T.sc_coin_hint }}</span>
        </div>
        <details class="adv">
          <summary>{{ T.sc_adv }}</summary>
          <div class="field">
            <label for="oKnown">{{ T.sc_known_len }}</label>
            <input type="number" id="oKnown" min="2" max="12" step="0.01" inputmode="decimal">
            <span class="hint">{{ T.sc_known_hint }}</span>
          </div>
          <div class="field">
            <label for="oChalk">{{ T.sc_chalk_sens }}: <span id="oChalkV">0.45</span></label>
            <input type="range" id="oChalk" min="0.25" max="0.7" step="0.01" value="0.45">
          </div>
        </details>
        <button type="button" class="btn btn-primary" id="bRun" style="width:100%;margin-top:14px" disabled>{{ T.sc_run }}</button>
        <div class="privacy">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" style="flex:none;margin-top:2px"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          <span>{{ T.sc_privacy }}</span>
        </div>
      </aside>

      <div>
        <div class="panel">
          <div class="stage" id="stage">
            <div class="empty" id="empty">
              <svg width="56" height="56" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 8c10 7 14 18 10 30-2 8-6 12-10 14-4-2-8-6-10-14-4-12 0-23 10-30z" fill="none" stroke="#6f7a6d" stroke-width="2.5"/></svg>
              <p>{{ T.sc_empty }}</p>
            </div>
            <canvas id="cv" class="hidden" aria-label="{{ T.sc_results }}"></canvas>
            <div id="busy" class="hidden" style="position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.45);color:#fff">
              <div style="display:flex;gap:10px;align-items:center"><div class="spinner"></div><span>{{ T.sc_analysing }}</span></div>
            </div>
          </div>
          <div class="stage-tools no-print hidden" id="tools">
            <button class="btn btn-ghost btn-sm" id="bOverlay">{{ T.sc_toggle_overlay }}</button>
            <button class="btn btn-ghost btn-sm" id="bPng">{{ T.sc_download_png }}</button>
            <button class="btn btn-ghost btn-sm" id="bCsv">{{ T.sc_download_csv }}</button>
            <button class="btn btn-ghost btn-sm" id="bPrint">{{ T.sc_print }}</button>
          </div>
          <div class="legend hidden" id="legend"></div>
          <p class="fine hidden" id="meta" style="margin:10px 0 0"></p>
        </div>

        <div class="panel hidden" id="results" style="margin-top:18px" aria-live="polite"></div>
      </div>
    </div>
  </div>
</section>
