name: Update rice prices

on:
  schedule:
    - cron: '37 10 * * *'   # 17:37 Bangkok, after DIT's daily prices and TREA's Wednesday quotes are posted
  push:                     # re-pull when the pipeline itself changes (the bot's own data commits don't re-trigger)
    branches: [main]
    paths: ['pipeline/**', '.github/workflows/prices.yml']
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Re-pull full history from every source'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r pipeline/requirements.txt
      - name: Test parsers offline
        run: python3 tests/test_prices.py
      - name: Pull prices
        run: python3 pipeline/fetch_prices.py ${{ inputs.backfill && '--backfill' || '' }}
      - name: Commit (Netlify rebuilds the site on push)
        run: |
          git config user.name "rice.ag price bot"
          git config user.email "actions@users.noreply.github.com"
          git add data src/static/data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Update rice prices $(date -u +%Y-%m-%d)"
          git push
