[build]
  command = "python3 build.py"
  publish = "dist"

[build.environment]
  PYTHON_VERSION = "3.11"

# /prices/ moved to the homepage (Oct 2026). Only the bare path redirects:
# /prices/<country-or-type>/ are real pages (Nov 2026).
[[redirects]]
  from = "/prices/"
  to = "/"
  status = 301

[[redirects]]
  from = "/prices"
  to = "/"
  status = 301

[[redirects]]
  from = "/th/prices/"
  to = "/th/"
  status = 301

[[redirects]]
  from = "/th/prices"
  to = "/th/"
  status = 301
